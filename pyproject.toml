[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knovex-ai"
version = "0.1.0"
description = "Knovex AI - Multi-Tenant RAG Document Chatbot with Grok, Qdrant Hybrid Search & LangGraph"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Knovex AI Engineering" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.20",
    "langchain-xai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-qdrant>=0.1.4",
    "qdrant-client>=1.11.0",
    "fastembed>=0.3.4",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "fakeredis>=2.24.0",
    "ragas>=0.1.14"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["knovex*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
