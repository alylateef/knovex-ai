events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression (disabled per-route for SSE)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Hide Nginx version from error pages and Server header
    server_tokens off;

    upstream backend {
        server backend:8000;
    }

    # 1. HTTP server: ACME challenge + redirect everything else to HTTPS
    server {
        listen 80;
        # Raw EC2 IP removed — only serve via domain to prevent direct-IP bypass
        server_name knovex.duckdns.org _;

        # Let's Encrypt renewal challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS server: SSL termination + reverse proxy to FastAPI & React
    server {
        listen 443 ssl;
        http2 on;
        server_name knovex.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/knovex.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/knovex.duckdns.org/privkey.pem;

        # Modern SSL configuration — TLS 1.2/1.3 only, strong ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # OCSP Stapling — eliminates per-connection OCSP round-trip to Let's Encrypt,
        # saving 100-300ms latency on new TLS sessions
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # Security headers — applied to all responses from this server block
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # HSTS — tell browsers to always use HTTPS for 1 year (enable after cert is confirmed stable)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # SSE streaming — unbuffered for immediate token flush (handles both /api/v1/chat/stream and legacy /api/chat/stream)
        location ~ ^/api/(v1/)?chat/stream {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            gzip               off;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;

            proxy_set_header   Connection '';
            proxy_http_version 1.1;
        }

        # All API endpoints
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_buffering    off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            # Match app's 15MB limit + small overhead for multipart boundaries
            client_max_body_size 16M;
        }

        # Health check
        location /health {
            proxy_pass http://backend;
        }

        # Frontend assets & Single Page App routes
        location / {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
